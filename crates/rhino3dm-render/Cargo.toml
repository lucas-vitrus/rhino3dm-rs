[package]
name = "rhino3dm-render"
version = "0.1.0"
edition = "2021"
description = "Lightweight, loss-aware technical 2D rendering for rhino3dm-rs scenes"
license = "MIT"
repository = "https://github.com/lucas-vitrus/rhino3dm-rs"
keywords = ["rhino", "3dm", "render", "svg", "cad"]
categories = ["graphics", "rendering"]

[dependencies]
rhino3dm-rs = { path = "../.." }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
