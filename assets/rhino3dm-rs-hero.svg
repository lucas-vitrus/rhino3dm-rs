<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">rhino3dm-rs</title>
  <desc id="desc">A technical wireframe rhinoceros emerging from a native 3DM archive into Rust geometry.</desc>
  <defs>
